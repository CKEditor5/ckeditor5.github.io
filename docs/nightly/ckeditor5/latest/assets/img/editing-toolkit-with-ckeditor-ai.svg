<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 948" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/>
    </marker>
  </defs>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with CKEditor AI</text>
  <line x1="160" y1="150" x2="160" y2="170" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="208" x2="160" y2="330" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="349" x2="160" y2="728" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="747" x2="160" y2="784" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="804" x2="160" y2="850" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="150" x2="430" y2="330" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="349" x2="430" y2="386" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="406" x2="430" y2="630" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="650" x2="430" y2="728" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="747" x2="430" y2="784" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="804" x2="430" y2="850" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="150" x2="700" y2="574" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="593" x2="700" y2="904" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="150" x2="970" y2="574" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="593" x2="970" y2="904" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="45" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M45,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="160" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your UI and your frontend code</text>
  <rect x="315" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M315,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="430" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Editing Toolkit</text>
  <text x="430" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Compare, inside CKEditor 5</text>
  <rect x="585" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M585,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#1E3A8A"/>
  <text x="700" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your agent</text>
  <text x="700" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your AI logic, on your backend</text>
  <rect x="855" y="66" width="230" height="78" rx="12" fill="#115E59" filter="url(#shadow)"/>
  <text x="970" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">CKEditor AI Service</text>
  <text x="970" y="124" text-anchor="middle" font-size="14" fill="#CCFBF1">Document Processing endpoint</text>
  <rect x="31" y="170" width="259" height="38" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="160" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. The user picks an action</text>
  <line x1="170" y1="258" x2="420" y2="258" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="247" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">2. Take a snapshot</text>
  <line x1="420" y1="322" x2="170" y2="322" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="344" text-anchor="middle" font-size="14" fill="#4B4766">snapshot: HTML, structural element IDs, and editor state</text>
  <line x1="170" y1="412" x2="690" y2="412" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="430" y="401" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">3. The request and the snapshot content</text>
  <line x1="710" y1="476" x2="960" y2="476" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="465" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">4. Prompt + document</text>
  <text x="835" y="498" text-anchor="middle" font-size="14" fill="#4B4766">POST /documents/process</text>
  <line x1="960" y1="566" x2="710" y2="566" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="555" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">5. Processed HTML</text>
  <text x="835" y="588" text-anchor="middle" font-size="14" fill="#4B4766">edited by the CKEditor AI agent, IDs preserved</text>
  <line x1="690" y1="656" x2="170" y2="656" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="430" y="645" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">6. Processed HTML, plus the reply your UI shows</text>
  <line x1="170" y1="720" x2="420" y2="720" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="709" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">7. Compare with the snapshot</text>
  <text x="295" y="742" text-anchor="middle" font-size="14" fill="#4B4766">only the differences, grouped into changes</text>
  <line x1="420" y1="810" x2="170" y2="810" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="799" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">8. Proposed changes in the editor</text>
  <rect x="95" y="850" width="400" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="295" y="872" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">9. The user applies or rejects each change</text>
  <text x="295" y="893" text-anchor="middle" font-size="14" fill="#4B4766">Apply directly or as a Track Changes suggestion</text>
  <text x="295" y="934" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
  <text x="835" y="934" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">BACKEND</text>
</svg>
