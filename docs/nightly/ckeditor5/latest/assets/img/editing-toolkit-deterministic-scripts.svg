<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 794" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/>
    </marker>
  </defs>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with deterministic scripts</text>
  <line x1="190" y1="150" x2="190" y2="170" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="224" x2="190" y2="330" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="349" x2="190" y2="630" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="650" x2="190" y2="696" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="150" x2="565" y2="330" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="349" x2="565" y2="386" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="406" x2="565" y2="450" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="470" x2="565" y2="484" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="503" x2="565" y2="630" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="650" x2="565" y2="696" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="940" y1="150" x2="940" y2="750" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="40" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M40,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#4C1D95"/>
  <text x="190" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="190" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your UI and your frontend code</text>
  <rect x="415" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M415,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#4C1D95"/>
  <text x="565" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Editing Toolkit</text>
  <text x="565" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Compare, inside CKEditor 5</text>
  <rect x="790" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M790,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#1E3A8A"/>
  <text x="940" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your script</text>
  <text x="940" y="129" text-anchor="middle" font-size="14" fill="#4B4766">In the browser or on your backend</text>
  <rect x="40" y="170" width="300" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="190" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. The user starts an update</text>
  <text x="190" y="213" text-anchor="middle" font-size="14" fill="#4B4766">or your code schedules one</text>
  <line x1="200" y1="258" x2="555" y2="258" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="247" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">2. Take a snapshot</text>
  <line x1="555" y1="322" x2="200" y2="322" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="344" text-anchor="middle" font-size="14" fill="#4B4766">snapshot: HTML with element IDs and editor state</text>
  <line x1="200" y1="412" x2="930" y2="412" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="401" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">3. The snapshot content</text>
  <line x1="930" y1="476" x2="200" y2="476" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="465" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">4. New HTML</text>
  <text x="565" y="498" text-anchor="middle" font-size="14" fill="#4B4766">the HTML returned by your script</text>
  <line x1="200" y1="566" x2="555" y2="566" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="555" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">5. Compare with the snapshot</text>
  <text x="378" y="588" text-anchor="middle" font-size="14" fill="#4B4766">only the differences, grouped into changes</text>
  <line x1="555" y1="656" x2="200" y2="656" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="645" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">6. Changes applied, suggested, or proposed in the editor</text>
  <rect x="178" y="696" width="400" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="378" y="718" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">7. The user applies or rejects each change</text>
  <text x="378" y="739" text-anchor="middle" font-size="14" fill="#4B4766">Apply directly or as a Track Changes suggestion</text>
  <text x="377" y="780" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
  <text x="940" y="780" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">YOUR CODE, ANYWHERE</text>
</svg>
