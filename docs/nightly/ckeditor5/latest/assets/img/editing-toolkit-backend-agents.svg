<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 944" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/></marker>
  </defs>
  <rect width="1130" height="944" fill="#FFF"/>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with backend agent workflows</text>
  <line x1="160" y1="150" x2="160" y2="884" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="150" x2="430" y2="884" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="150" x2="700" y2="884" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="150" x2="970" y2="884" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="45" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M45,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#1E3A8A"/>
  <text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your backend</text>
  <text x="160" y="129" text-anchor="middle" font-size="14" fill="#4B4766">A job that your code starts</text>
  <rect x="315" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M315,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#1E3A8A"/>
  <text x="430" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your agents</text>
  <text x="430" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your models and prompts</text>
  <rect x="585" y="66" width="230" height="78" rx="12" fill="#115E59" filter="url(#shadow)"/>
  <text x="700" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Coauthor</text>
  <text x="700" y="124" text-anchor="middle" font-size="14" fill="#CCFBF1">CKEditor MCP server</text>
  <rect x="855" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M855,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="970" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="970" y="129" text-anchor="middle" font-size="14" fill="#4B4766">CKEditor 5 with Track Changes</text>
  <rect x="27" y="170" width="267" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="160" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. A trigger starts the job</text>
  <text x="160" y="213" text-anchor="middle" font-size="14" fill="#4B4766">such as a nightly review</text>
  <text x="430" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">2. Open a session for the first agent</text>
  <line x1="170" y1="286" x2="690" y2="286" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="430" y="308" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">live document, the agent as actor, suggest mode</text>
  <text x="295" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">3. Start the agent with its session token</text>
  <line x1="170" y1="376" x2="420" y2="376" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">4. Read, edit, and check</text>
  <line x1="440" y1="440" x2="690" y2="440" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="462" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">MCP tools, each edit checked by your editor</text>
  <text x="835" y="519" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">5. Suggestions arrive</text>
  <line x1="710" y1="530" x2="960" y2="530" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="552" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">through real-time collaboration, under the agent&#x27;s name</text>
  <text x="430" y="609" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">6. Close it, open one for the review agent</text>
  <line x1="170" y1="620" x2="690" y2="620" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="673" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">7. The review agent checks and fixes</text>
  <line x1="440" y1="684" x2="690" y2="684" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="706" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">it reads the earlier suggestions</text>
  <text x="835" y="763" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">8. More suggestions arrive</text>
  <line x1="710" y1="774" x2="960" y2="774" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="668" y="808" width="452" height="38" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="894" y="833" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">9. Later, people accept or reject each suggestion</text>
  <text x="295" y="914" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">BACKEND</text>
  <text x="700" y="914" text-anchor="middle" font-size="13" font-weight="600" fill="#115E59" letter-spacing="0.5">CLOUD SERVICES</text>
  <text x="970" y="914" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
</svg>
