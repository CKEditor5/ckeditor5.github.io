<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 1098" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/></marker>
  </defs>
  <rect width="1130" height="1098" fill="#FFF"/>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with a custom chat</text>
  <line x1="160" y1="150" x2="160" y2="1038" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="150" x2="430" y2="1038" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="150" x2="700" y2="1038" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="150" x2="970" y2="1038" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="45" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M45,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="160" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your chat panel and frontend</text>
  <rect x="315" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M315,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="430" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Editing Toolkit</text>
  <text x="430" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Compare, inside CKEditor 5</text>
  <rect x="585" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M585,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#1E3A8A"/>
  <text x="700" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your agent</text>
  <text x="700" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Your model and your tools</text>
  <rect x="855" y="66" width="230" height="78" rx="12" fill="#115E59" filter="url(#shadow)"/>
  <text x="970" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Coauthor</text>
  <text x="970" y="124" text-anchor="middle" font-size="14" fill="#CCFBF1">CKEditor MCP server</text>
  <rect x="18" y="170" width="284" height="38" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="160" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. The user asks in your chat</text>
  <text x="295" y="259" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">2. Take a snapshot</text>
  <line x1="170" y1="270" x2="420" y2="270" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="420" y1="334" x2="170" y2="334" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="356" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">snapshot: HTML with element IDs and editor state</text>
  <text x="430" y="413" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">3. The request and the snapshot</text>
  <line x1="170" y1="424" x2="690" y2="424" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="477" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">4. Open a session on the snapshot</text>
  <line x1="710" y1="488" x2="960" y2="488" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="510" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">POST /sessions</text>
  <text x="835" y="567" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">5. Read, edit, and check</text>
  <line x1="710" y1="578" x2="960" y2="578" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="600" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">MCP tools, next to your own tools</text>
  <text x="835" y="657" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">6. The working copy</text>
  <line x1="960" y1="668" x2="710" y2="668" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="690" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">only what your editor keeps</text>
  <text x="430" y="747" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">7. The new HTML, plus the reply your chat shows</text>
  <line x1="690" y1="758" x2="170" y2="758" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="811" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">8. Compare with the snapshot</text>
  <line x1="170" y1="822" x2="420" y2="822" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="844" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">only the differences, grouped into changes</text>
  <text x="295" y="901" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">9. Proposed changes in the editor</text>
  <line x1="420" y1="912" x2="170" y2="912" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="94" y="946" width="401" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="295" y="968" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">10. The user accepts or rejects each change</text>
  <text x="295" y="989" text-anchor="middle" font-size="14" fill="#4B4766">directly or as a Track Changes suggestion</text>
  <text x="295" y="1068" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
  <text x="700" y="1068" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">BACKEND</text>
  <text x="970" y="1068" text-anchor="middle" font-size="13" font-weight="600" fill="#115E59" letter-spacing="0.5">CLOUD SERVICES</text>
</svg>
