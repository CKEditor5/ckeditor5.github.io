<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 928" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/></filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/></marker>
  </defs>
  <rect width="1130" height="928" fill="#FFF"/>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with agent apps</text>
  <line x1="160" y1="150" x2="160" y2="868" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="430" y1="150" x2="430" y2="868" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="700" y1="150" x2="700" y2="868" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="970" y1="150" x2="970" y2="868" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="45" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
  <path d="M45,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#334155"/>
  <text x="160" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Agent app</text>
  <text x="160" y="129" text-anchor="middle" font-size="14" fill="#4B4766">ChatGPT or Claude</text>
  <rect x="315" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M315,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#1E3A8A"/>
  <text x="430" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your backend</text>
  <text x="430" y="129" text-anchor="middle" font-size="14" fill="#4B4766">The MCP server of your app</text>
  <rect x="585" y="66" width="230" height="78" rx="12" fill="#115E59" filter="url(#shadow)"/>
  <text x="700" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Coauthor</text>
  <text x="700" y="124" text-anchor="middle" font-size="14" fill="#CCFBF1">CKEditor MCP server</text>
  <rect x="855" y="66" width="230" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M855,78 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v28 h-230 z" fill="#4C1D95"/>
  <text x="970" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="970" y="129" text-anchor="middle" font-size="14" fill="#4B4766">CKEditor 5 with Track Changes</text>
  <rect x="10" y="170" width="317" height="38" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="169" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. The user asks in the agent app</text>
  <text x="295" y="259" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">2. Find the document</text>
  <line x1="170" y1="270" x2="420" y2="270" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="292" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">your own tool, for the signed-in user</text>
  <text x="295" y="349" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">3. The document ID</text>
  <line x1="420" y1="360" x2="170" y2="360" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="382" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">only documents that the user may edit</text>
  <text x="295" y="439" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">4. A document tool, such as editDocument</text>
  <line x1="170" y1="450" x2="420" y2="450" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="503" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">5. Pass it on in the user&#x27;s session</text>
  <line x1="440" y1="514" x2="690" y2="514" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="536" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">backend token, the user as actor, suggest mode</text>
  <text x="835" y="593" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">6. The suggestion arrives</text>
  <line x1="710" y1="604" x2="960" y2="604" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="835" y="626" text-anchor="middle" font-size="14" fill="#4B4766" stroke="#FFF" stroke-width="6" paint-order="stroke">checked by your editor, through real-time collaboration</text>
  <text x="565" y="683" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">7. Done, or refused with the reason</text>
  <line x1="690" y1="694" x2="440" y2="694" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="295" y="747" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95" stroke="#FFF" stroke-width="6" paint-order="stroke">8. The answer that the agent app reports</text>
  <line x1="420" y1="758" x2="170" y2="758" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="694" y="792" width="426" height="38" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="907" y="817" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">9. The user reviews the suggestion in your app</text>
  <text x="160" y="898" text-anchor="middle" font-size="13" font-weight="600" fill="#334155" letter-spacing="0.5">AGENT APP</text>
  <text x="430" y="898" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">BACKEND</text>
  <text x="700" y="898" text-anchor="middle" font-size="13" font-weight="600" fill="#115E59" letter-spacing="0.5">CLOUD SERVICES</text>
  <text x="970" y="898" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
</svg>
