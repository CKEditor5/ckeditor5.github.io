<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 794" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4C1D95"/>
    </marker>
  </defs>
  <text x="565" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E1B3A" letter-spacing="-0.3">Editing Toolkit with branched documents</text>
  <line x1="190" y1="150" x2="190" y2="170" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="224" x2="190" y2="316" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="370" x2="190" y2="640" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="664" x2="190" y2="696" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="150" x2="565" y2="236" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="290" x2="565" y2="390" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="444" x2="565" y2="556" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="634" x2="565" y2="696" stroke="#D4C5EC" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="940" y1="150" x2="940" y2="750" stroke="#B8CCEC" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="40" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M40,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#4C1D95"/>
  <text x="190" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Your application</text>
  <text x="190" y="129" text-anchor="middle" font-size="14" fill="#4B4766">The document in CKEditor 5: branch A</text>
  <rect x="415" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#D4C5EC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M415,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#4C1D95"/>
  <text x="565" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Editing Toolkit</text>
  <text x="565" y="129" text-anchor="middle" font-size="14" fill="#4B4766">Compare, inside CKEditor 5</text>
  <rect x="790" y="66" width="300" height="78" rx="12" fill="#FFF" stroke="#B8CCEC" stroke-width="1" filter="url(#shadow)"/>
  <path d="M790,78 a12,12 0 0 1 12,-12 h276 a12,12 0 0 1 12,12 v28 h-300 z" fill="#1E3A8A"/>
  <text x="940" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF">Branch B</text>
  <text x="940" y="129" text-anchor="middle" font-size="14" fill="#4B4766">A copy edited somewhere else</text>
  <rect x="40" y="170" width="300" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="190" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">1. A copy of the document is made</text>
  <text x="190" y="213" text-anchor="middle" font-size="14" fill="#4B4766">your application stores the HTML as the base</text>
  <line x1="200" y1="264" x2="930" y2="264" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">2. The copy becomes branch B</text>
  <text x="565" y="286" text-anchor="middle" font-size="14" fill="#4B4766">another team, another system, or an exported file</text>
  <rect x="40" y="316" width="300" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="190" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">3. The document keeps being edited</text>
  <text x="190" y="359" text-anchor="middle" font-size="14" fill="#4B4766">this is branch A</text>
  <line x1="930" y1="418" x2="200" y2="418" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="565" y="407" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">4. Branch B as HTML</text>
  <text x="565" y="440" text-anchor="middle" font-size="14" fill="#4B4766">converted to HTML if it comes in another format</text>
  <line x1="200" y1="508" x2="555" y2="508" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="497" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">5. Compare with the stored HTML as the base</text>
  <text x="378" y="530" text-anchor="middle" font-size="14" fill="#4B4766">the stored HTML and branch B, instead of a snapshot</text>
  <rect x="415" y="556" width="300" height="78" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="565" y="580" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">6. Both sets of changes are merged</text>
  <text x="565" y="601" text-anchor="middle" font-size="14" fill="#4B4766">the edits made in branch A stay,</text>
  <text x="565" y="620" text-anchor="middle" font-size="14" fill="#4B4766">the changes from branch B are added</text>
  <line x1="555" y1="668" x2="200" y2="668" stroke="#4C1D95" stroke-width="2" marker-end="url(#ah)"/>
  <text x="378" y="657" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">7. Changes applied, suggested, or proposed in the editor</text>
  <rect x="178" y="696" width="400" height="54" rx="8" fill="#F5F3FF" stroke="#D4C5EC" stroke-width="1"/>
  <text x="378" y="718" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">8. The user reviews branch A</text>
  <text x="378" y="739" text-anchor="middle" font-size="14" fill="#4B4766">Applied directly or as Track Changes suggestions</text>
  <text x="377" y="780" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95" letter-spacing="0.5">FRONTEND</text>
  <text x="940" y="780" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">ANOTHER TEAM, SYSTEM, OR FILE</text>
</svg>
